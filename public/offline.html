<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#F6F1EA">
    <title>Connect to Pelvi</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #F6F1EA; color: #3A2F44; font: 16px/1.6 system-ui, sans-serif; }
      main { width: 100%; max-width: 400px; padding: 32px 26px; border: 1px solid #3A2F4420; border-radius: 24px; background: #FFFCF8; text-align: center; }
      .brand { margin: 0; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 18px 0 10px; font: 36px/1.15 Georgia, serif; }
      p { margin: 0; color: #625569; }
      a { display: block; margin-top: 28px; min-height: 48px; padding: 12px 18px; border-radius: 999px; background: #3A2F44; color: white; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 3px solid #B66476; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Pelvi</p>
      <h1>You’re offline</h1>
      <p>Connect to the internet to continue. Your account and sessions are loaded online.</p>
      <a href="/app">Try Pelvi again</a>
    </main>
  </body>
</html>
